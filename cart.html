<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cart - HBeeSound</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="navbar">
      <div class="container">
        <a href="index.html" class="logo">
          <span>HBeeSound</span>
        </a>
        <nav class="nav-links">
          <a href="#our-collection">Our Collection</a>
          <a href="#new-arrivals">New Arrivals</a>
          <a href="#for-gamers">For Gamers</a>
        </nav>
      </div>
    </header>

    <!--CART-->

    <main>
      <section class="section">
        <div class="container">
          <h1 class="cart-title">Your Cart</h1>

          <div class="cart-item">
            <div class="cart-image">
              <img src="Beats By Dre.png" alt="Beats By Dre" />
            </div>
            <div class="cart-info">
              <h3>Beats By Dre</h3>
              <div class="colors">
                <span class="dot black"></span>
                <span class="dot gray"></span>
                <span class="dot navy"></span>
              </div>
              <p class="price">BAM 29.99</p>
              <p class="delivery-info">Delivery Time: 2 work days</p>
              <a href="product.html#beats-by-dre" class="cart-product-link"
                >View Product</a
              >
            </div>
          </div>

         
          <div class="cart-actions">
            <a href="index.html#our-collection" class="btn-outline">
              <i class="fas fa-arrow-left"></i>
              Back To Shopping
            </a>

            <a href="checkout.html" class="btn-add-cart">
              Proceed To Checkout
              <i class="fas fa-arrow-right"></i>
            </a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
