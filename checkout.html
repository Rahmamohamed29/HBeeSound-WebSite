<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Checkout - HBeeSound</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Navbar -->
    <header class="navbar">
      <div class="container">
        <a href="index.html" class="logo">
          <span>HBeeSound</span>
        </a>
        <nav class="nav-links">
          <a href="#our-collection">Our Collection</a>
          <a href="#new-arrivals">New Arrivals</a>
          <a href="#for-gamers">For Gamers</a>
        </nav>
      </div>
    </header>

    <section class="section">
      <div class="container checkout-container">
        <h1>Checkout</h1>

        <p>Complete your shipping information to place your order.</p>

        <form class="checkout-form" action="#" method="get">
          <!-- Shipping Information -->
           
          <h3>Shipping Information</h3>

          <label for="shipping-address"> Shipping Address </label>

          <input
            type="text"
            id="shipping-address"
            name="address"
            placeholder="Enter Your Shipping Address"
            autocomplete="street-address"
            required
          />

          <label for="name"> Your Name </label>

          <input
            type="text"
            id="Name"
            name="Your Name"
            placeholder="Enter Your Name"
            autocomplete="text"
            required
          />


          <label for="phone"> Phone Number </label>

          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter Your Phone Number"
            autocomplete="tel"
            required
          />

          <!-- Payment Information -->

          <label for="card-number"> Card Number </label>

          <input
            type="text"
            id="card-number"
            name="card-number"
            placeholder="Enter Your Card Number"
            inputmode="numeric"
            autocomplete="off"
            required
          />

          <div class="card-row">
            <div>
              <label for="expiration"> Expiration Date </label>

              <input
                type="text"
                id="expiration"
                name="expiration"
                placeholder="MM/YY"
                autocomplete="off"
                required
              />
            </div>

            <div>
              <label for="cvc"> CVC </label>

              <input
                type="password"
                id="cvc"
                name="cvc"
                placeholder="CVC"
                inputmode="numeric"
                autocomplete="off"
                required
              />
            </div>
          </div>

          <div class="checkout-actions">
            <a href="cart.html" class="btn-outline">
              <i class="fas fa-arrow-left"></i>
              Back To Cart
            </a>

            <button type="submit" class="btn-add-cart">
              Place Order
              <i class="fas fa-check"></i>
            </button>
          </div>
        </form>
      </div>
    </section>
  </body>
</html>
